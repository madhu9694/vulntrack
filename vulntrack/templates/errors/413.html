{% extends "base.html" %}
{% block title %}File Too Large (413){% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-6">
    <div class="display-1 fw-bold text-warning mb-3">413</div>
    <h3 class="text-white mb-3">Report File Too Large</h3>
    <p class="text-muted mb-4">The uploaded scan report exceeds the allowed 16 MB limit. Please filter your scan export in OWASP ZAP and try again.</p>
    <a href="{{ url_for('assessments.index') }}" class="btn btn-orange">
      <i class="bi bi-shield-check me-1"></i> Return to Assessments
    </a>
  </div>
</div>
{% endblock %}
