{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-6">
    <div class="display-1 fw-bold text-warning mb-3">404</div>
    <h3 class="text-white mb-3">Resource Not Found</h3>
    <p class="text-muted mb-4">The assessment, finding, or page you are requesting could not be located on the server.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-orange">
      <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
